<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#121212">
<title>Miko Parkinson | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--paper:#121212;--panel:#1b1b1b;--well:#161616;--ink:#efe8e6;--mute:#a69e9c;--line:#2c2c2c;--accent:#f47068;--accent-deep:#c93b37;--add:#3fb97a;--mod:#e8b020;--rem:#ff938b}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 "Source Sans 3",system-ui,sans-serif}
h1,h2,b{font-family:Archivo,system-ui,sans-serif}
h1,h2{margin:0;letter-spacing:-.02em;font-stretch:112%;font-weight:700;line-height:1.05}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:baseline;padding:18px clamp(16px,4vw,48px);border-bottom:1px solid var(--line)}
.top a{text-decoration:none;font-family:Archivo,sans-serif;font-weight:800;font-size:1.35rem;font-stretch:112%}
main{padding:clamp(16px,4vw,48px);max-width:1280px;margin:0 auto}
.hero{max-width:760px;margin:24px auto 48px;text-align:center}
.hero h1{font-size:clamp(2.4rem,6vw,4.4rem)}
.hero p{color:var(--mute);margin:16px auto 0;max-width:52ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);text-decoration:none;overflow:hidden}
.card:hover{border-color:var(--accent)}
.thumb{aspect-ratio:16/10;background:var(--well);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
/* the whole picture is shown (no cropping); a blurred, dimmed copy fills the leftover space */
.thumb .fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(20px) brightness(.45);transform:scale(1.2)}
.thumb .pic{position:relative;width:100%;height:100%;object-fit:contain;display:block}
.thumb svg{width:34%;height:auto;stroke:var(--line);fill:none;stroke-width:2;stroke-linejoin:round}
.cbody{display:flex;flex-direction:column;gap:12px;padding:20px 22px 22px;flex:1}
.card h2{font-size:1.5rem}
.card p{margin:0;color:var(--mute)}
.ruler{display:flex;align-items:flex-end;gap:9px;height:22px;margin-top:auto}
.ruler i{display:block;width:3px;height:12px;background:var(--c)}
.ruler i:last-child{height:22px}
.meta{font-size:.9rem;color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{border:1px solid var(--line);padding:0 8px;font-size:.85rem;color:var(--mute)}
.back{display:inline-block;margin-bottom:18px;color:var(--mute)}
.phead{margin-bottom:24px;max-width:70ch}
.phead h1{font-size:clamp(2rem,4.5vw,3.2rem)}
.phead p{color:var(--mute);margin:10px 0 0}
/* windows: two columns; a lone window spans both */
.wins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px 28px;align-items:start}
.win{min-width:0}
.win:only-child{grid-column:1/-1}
.work{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.win:only-child .work{grid-template-columns:minmax(0,1fr) 330px;gap:28px}
.viewer{height:min(52vh,460px);min-height:300px;border:1px solid var(--line);background-color:var(--well);background-image:linear-gradient(#222 1px,transparent 1px),linear-gradient(90deg,#222 1px,transparent 1px);background-size:32px 32px;background-position:-1px -1px;cursor:grab;position:relative}
.win:only-child .viewer{height:min(68vh,640px)}
.viewer canvas{display:block;width:100%;height:100%}
.fname{position:absolute;left:12px;bottom:12px;z-index:2;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:3px 10px;background:rgba(18,18,18,.82);border:1px solid var(--line);font-weight:700;font-size:.95rem;pointer-events:none}
/* assembly windows: loading/error message sits inside the viewer, description below */
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;margin:0;text-align:center;color:var(--mute);pointer-events:none}
.overlay:empty{display:none}
.desc{margin:14px 0 0;max-width:70ch;white-space:pre-line}
/* the assembly is the main model: full width, centered, ahead of the parts */
.win.asm{grid-column:1/-1}
.win.asm .viewer{height:min(68vh,640px)}
.win.asm .desc{margin:18px auto 0;text-align:center;font-size:1.1rem}
.win.asm + .win:last-child{grid-column:1/-1}
/* part windows: change highlighting, status line and version list */
.bar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:12px 0 4px;font-size:.95rem}
.bar label{cursor:pointer}
.bar input[type=checkbox]{accent-color:var(--accent);margin-right:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;background:var(--c)}
.status{margin:0;color:var(--mute);min-height:1.5em}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);max-height:340px;overflow-y:auto}
.win:only-child .tl{max-height:none;position:sticky;top:16px}
.tl li{position:relative;margin-bottom:6px}
.tl li::before{content:"";position:absolute;left:-24px;top:18px;width:10px;height:2px;background:var(--line)}
.tl li.on::before{background:var(--accent);width:16px;left:-30px;height:3px}
.tl button{all:unset;box-sizing:border-box;display:block;width:100%;padding:10px 12px;cursor:pointer}
.tl button:hover{background:var(--panel)}
.tl button:focus-visible{outline:3px solid var(--accent)}
.tl li.on button{background:var(--panel);box-shadow:inset 3px 0 var(--accent)}
.tl b{font-size:1.1rem;margin-right:10px}
.tl time{font-size:.85rem;color:var(--mute)}
.tl span{display:block;margin-top:2px}
/* progress photos, uploaded from the phone app; newest first */
.progress{margin-top:64px;padding-top:28px;border-top:1px solid var(--line)}
.progress h2{font-size:clamp(1.6rem,3vw,2.1rem)}
.progress .sub{color:var(--mute);margin:8px 0 0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;margin-top:22px}
.pitem{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.pitem button{all:unset;cursor:zoom-in;display:block;aspect-ratio:4/3;background:var(--well)}
.pitem button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.pitem img{width:100%;height:100%;object-fit:cover;display:block}
.pitem .pmeta{padding:12px 14px 14px}
.pitem time{display:block;font-size:.85rem;color:var(--mute)}
.pitem p{margin:4px 0 0;white-space:pre-line}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(10,10,10,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;cursor:zoom-out}
.lightbox img{max-width:92vw;max-height:80vh;object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.lightbox p{margin:0;max-width:70ch;text-align:center;color:var(--ink)}
.lightbox time{color:var(--mute);font-size:.9rem}
@media (max-width:1000px){.wins{grid-template-columns:minmax(0,1fr)}.win:only-child .work{grid-template-columns:minmax(0,1fr)}.win:only-child .tl{position:static}}
</style>
</head>
<body>
<div class="top"><a href="#/" id="brand">Miko Parkinson</a><span class="meta" id="tag"></span></div>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/occt-import-js.js"></script>
<script>
const OCCT_BASE = "https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/";
const COLORS = {same: 0xb9b4b2, dim: 0x4b4948, added: 0x3fb97a, modified: 0xe8b020, removed: 0xff938b};
// Red gradient, light to dark. Version ticks on each card run dark (oldest) to light (latest).
const GRADIENT = ["#FFDAD5", "#FFB8B0", "#FF938B", "#F47068", "#E5534B", "#C93B37", "#AD2E2B", "#922323", "#78191B", "#5D1012"];
const tickColor = (i, n) => GRADIENT[n < 2 ? 3 : 7 - Math.round(i / (n - 1) * 4)];
const PLACEHOLDER = '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6 56 19v26L32 58 8 45V19z"/><path d="M8 19l24 13 24-13M32 32v26"/></svg>';
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cache = new Map();
let DATA, PROGRESS = {projects: {}}, occt, wins = [];

async function getOcct() {
  if (!occt) occt = await occtimportjs({locateFile: f => OCCT_BASE + f});
  return occt;
}

// Fixed (absolute) mesh precision, so an unchanged face is triangulated the same way in
// every version even when the overall model size changes. That makes faces comparable.
const MESH_PARAMS = {linearUnit: "millimeter", linearDeflectionType: "absolute_value", linearDeflection: 0.1, angularDeflection: 0.5};

// Area, centroid and (for flat faces) plane of one B-rep face's triangles.
function faceStats(pos, idx, first, last) {
  let A = 0, cx = 0, cy = 0, cz = 0, nx0 = 0, ny0 = 0, nz0 = 0, flat = true, ref = null;
  for (let t = first; t <= last; t++) {
    const a = idx[3 * t] * 3, b = idx[3 * t + 1] * 3, c = idx[3 * t + 2] * 3;
    const ux = pos[b] - pos[a], uy = pos[b + 1] - pos[a + 1], uz = pos[b + 2] - pos[a + 2];
    const vx = pos[c] - pos[a], vy = pos[c + 1] - pos[a + 1], vz = pos[c + 2] - pos[a + 2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const len = Math.hypot(nx, ny, nz);
    if (!len) continue;
    const area = len / 2;
    A += area;
    cx += area * (pos[a] + pos[b] + pos[c]) / 3;
    cy += area * (pos[a + 1] + pos[b + 1] + pos[c + 1]) / 3;
    cz += area * (pos[a + 2] + pos[b + 2] + pos[c + 2]) / 3;
    nx0 += nx; ny0 += ny; nz0 += nz;
    if (!ref) ref = [nx / len, ny / len, nz / len];
    else if (flat && ref[0] * nx / len + ref[1] * ny / len + ref[2] * nz / len < 0.9999) flat = false;
  }
  if (!A) return null;
  const c = [cx / A, cy / A, cz / A];
  const nl = Math.hypot(nx0, ny0, nz0) || 1, n = [nx0 / nl, ny0 / nl, nz0 / nl];
  return {first, last, area: A, c, flat, n, d: n[0] * c[0] + n[1] * c[1] + n[2] * c[2]};
}

function partsFromStep(buf) {
  return getOcct().then(o => {
    const r = o.ReadStepFile(buf, MESH_PARAMS);
    if (!r.success) throw new Error("Could not read this STEP file.");
    return r.meshes.map((m, i) => {
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute(m.attributes.position.array, 3));
      g.setIndex(Array.from(m.index.array));
      const pos = m.attributes.position.array, idx = m.index.array;
      const stats = (m.brep_faces || []).map(f => faceStats(pos, idx, f.first, f.last));
      if (m.attributes.normal) g.setAttribute("normal", new THREE.Float32BufferAttribute(m.attributes.normal.array, 3));
      else g.computeVertexNormals();
      // Colors from the STEP file: one per part, and optionally per face.
      const faceColors = [];
      const faces = m.brep_faces || [];
      if (faces.some(f => f.color)) {
        const slots = new Map();
        const slot = c => {
          const k = c ? c.join() : "part";
          if (!slots.has(k)) { slots.set(k, faceColors.length); faceColors.push(c || null); }
          return slots.get(k);
        };
        faces.forEach(f => g.addGroup(f.first * 3, (f.last - f.first + 1) * 3, slot(f.color)));
      }
      return {name: m.name || "Part " + (i + 1), geo: g, color: m.color || null, faceColors,
        faces: stats.every(Boolean) && stats.length ? stats : null};
    });
  });
}

async function loadParts(v) {
  if (cache.has(v)) return cache.get(v);
  let parts;
  if (v.demo) {
    parts = v.demo.map(d => {
      const g = d.type === "cyl" ? new THREE.CylinderGeometry(d.size[0], d.size[0], d.size[1], 32) : new THREE.BoxGeometry(...d.size);
      g.translate(...d.pos);
      return {name: d.name, geo: g};
    });
  } else {
    const res = await fetch(v.file);
    if (!res.ok) throw new Error("Model file not found: " + v.file);
    parts = await partsFromStep(new Uint8Array(await res.arrayBuffer()));
  }
  cache.set(v, parts);
  return parts;
}

// Designcenter convention: Z is up. VIEW_DIR is where the camera sits relative to the
// model, matching the isometric view in Designcenter (X toward the left, Y toward the
// lower left, Z up). Change these three numbers to load from a different corner.
// (Plain numbers here, so the cards still show even if the 3D library fails to load.)
const VIEW_DIR = [-1, 1, 1];
const AXES = [
  {dir: [1, 0, 0], color: 0xff4f4f, label: "X"},
  {dir: [0, 1, 0], color: 0x4fdc6a, label: "Y"},
  {dir: [0, 0, 1], color: 0x4f8dff, label: "Z"},
];
const TRIAD_SIZE = 96;  // px

// Small XYZ triad, like the one in Designcenter's corner. It turns with the camera.
function makeTriad() {
  const scene = new THREE.Scene();
  const cam = new THREE.OrthographicCamera(-1.55, 1.55, 1.55, -1.55, 0.1, 10);
  const cube = new THREE.BoxGeometry(0.42, 0.42, 0.42);
  scene.add(new THREE.Mesh(cube, new THREE.MeshBasicMaterial({color: 0x8a8684, transparent: true, opacity: 0.55})));
  scene.add(new THREE.LineSegments(new THREE.EdgesGeometry(cube), new THREE.LineBasicMaterial({color: 0xefe8e6})));
  const yAxis = new THREE.Vector3(0, 1, 0);
  AXES.forEach(a => {
    const mat = new THREE.MeshBasicMaterial({color: a.color});
    const arm = new THREE.Group();
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.78, 12), mat);
    shaft.position.y = 0.39;
    const head = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.26, 16), mat);
    head.position.y = 0.91;
    arm.add(shaft, head);
    const dir = new THREE.Vector3(...a.dir);
    arm.quaternion.setFromUnitVectors(yAxis, dir);
    scene.add(arm);
    const c = document.createElement("canvas");
    c.width = c.height = 64;
    const g = c.getContext("2d");
    g.font = "bold 48px Archivo, sans-serif";
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillStyle = "#" + a.color.toString(16).padStart(6, "0");
    g.fillText(a.label, 32, 34);
    const label = new THREE.Sprite(new THREE.SpriteMaterial({map: new THREE.CanvasTexture(c), depthTest: false}));
    label.position.copy(dir).multiplyScalar(1.32);
    label.scale.setScalar(0.42);
    scene.add(label);
  });
  return {scene, cam};
}

// Each model (STEP file name) gets its own viewer.
function createViewer(el) {
  const r = new THREE.WebGLRenderer({antialias: true, alpha: true});
  r.setPixelRatio(Math.min(devicePixelRatio, 2));
  r.autoClear = false;
  el.appendChild(r.domElement);
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 10000);
  cam.up.set(0, 0, 1);  // must be set before the controls are created
  const ctl = new THREE.OrbitControls(cam, r.domElement);
  const triad = makeTriad();
  ctl.enableDamping = true;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.95));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(5, 10, 7);
  scene.add(sun);
  const group = new THREE.Group();
  scene.add(group);
  const size = () => {
    const w = el.clientWidth, h = el.clientHeight;
    r.setSize(w, h);
    cam.aspect = w / h;
    cam.updateProjectionMatrix();
  };
  const ro = new ResizeObserver(size);
  ro.observe(el);
  size();
  let visible = true;  // windows scrolled out of view stop drawing
  const io = new IntersectionObserver(e => { visible = e[0].isIntersecting; });
  io.observe(el);
  r.setAnimationLoop(() => {
    if (!visible) return;
    ctl.update();
    const w = el.clientWidth, h = el.clientHeight;
    r.setScissorTest(false);
    r.setViewport(0, 0, w, h);
    r.clear();
    r.render(scene, cam);
    // triad in the bottom-right corner (the file name label is bottom-left)
    triad.cam.quaternion.copy(cam.quaternion);
    triad.cam.position.set(0, 0, 4).applyQuaternion(cam.quaternion);
    const x = w - TRIAD_SIZE - 6;
    r.setScissorTest(true);
    r.setScissor(x, 6, TRIAD_SIZE, TRIAD_SIZE);
    r.setViewport(x, 6, TRIAD_SIZE, TRIAD_SIZE);
    r.clearDepth();
    r.render(triad.scene, triad.cam);
  });
  return {group, cam, ctl, dispose() { r.setAnimationLoop(null); ro.disconnect(); io.disconnect(); r.dispose(); }};
}

// STEP colors arrive as 0–1 values (some exporters use 0–255).
const rgb = c => new THREE.Color(...(c.some(x => x > 1) ? c.map(x => x / 255) : c));

// override: a single color for the whole part (change highlighting, removed ghosts).
// null: use the colors saved in the STEP file, falling back to gray.
const mkMat = (color, ghost) => new THREE.MeshStandardMaterial({color, metalness: 0.1, roughness: 0.6, side: THREE.DoubleSide,
  transparent: !!ghost, opacity: ghost ? 0.28 : 1, depthWrite: !ghost});

function addEdges(view, pt) {
  pt.edges = pt.edges || new THREE.EdgesGeometry(pt.geo, 30);  // computed once per part
  view.group.add(new THREE.LineSegments(pt.edges, new THREE.LineBasicMaterial({color: 0x0c0c0c, transparent: true, opacity: 0.55})));
}

function addPart(view, pt, override, ghost) {
  const own = c => c ? rgb(c) : pt.color ? rgb(pt.color) : COLORS.same;
  const faces = pt.faceColors || [];
  const mat = override != null ? mkMat(override, ghost) : faces.length ? faces.map(c => mkMat(own(c))) : mkMat(own(null));
  view.group.add(new THREE.Mesh(pt.geo, mat));
  if (!ghost) addEdges(view, pt);
}

// A second view of a part's triangles, colored face by face. Shares the part's buffers.
function faceGroups(pt, statusOf) {
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", pt.geo.getAttribute("position"));
  if (pt.geo.getAttribute("normal")) g.setAttribute("normal", pt.geo.getAttribute("normal"));
  g.setIndex(pt.geo.getIndex());
  pt.faces.forEach((f, fi) => {
    const s = statusOf(fi);
    if (s >= 0) g.addGroup(f.first * 3, (f.last - f.first + 1) * 3, s);
  });
  return g;
}

// ---- Face-by-face comparison between two versions ----
// Faces are matched by position and size, so a hole, chamfer or boss shows up as the
// faces it added or changed. Flat faces that stayed in the same plane but changed
// outline count as modified; anything else new counts as added.
const SAME = 0, ADDED = 1, MODIFIED = 2;

function faceDiff(oldParts, newParts) {
  const pool = ps => ps.flatMap((p, pi) => p.faces.map((f, fi) => ({f, pi, fi})));
  const O = pool(oldParts), N = pool(newParts);
  const box = new THREE.Box3();
  [...O, ...N].forEach(({f}) => box.expandByPoint(new THREE.Vector3(...f.c)));
  const diag = box.getSize(new THREE.Vector3()).length() || 1;
  const tol = diag * 2e-5, cell = diag * 1e-3;
  const key = (c, dx = 0, dy = 0, dz = 0) => `${Math.round(c[0] / cell) + dx},${Math.round(c[1] / cell) + dy},${Math.round(c[2] / cell) + dz}`;
  const grid = new Map();
  O.forEach((o, k) => { const kk = key(o.f.c); if (!grid.has(kk)) grid.set(kk, []); grid.get(kk).push(k); });
  const used = new Uint8Array(O.length);
  const near = (a, b) => Math.hypot(a.c[0] - b.c[0], a.c[1] - b.c[1], a.c[2] - b.c[2]) <= tol &&
    Math.abs(a.area - b.area) <= Math.max(a.area, b.area) * 1e-4 + tol * tol;
  const status = newParts.map(p => new Int8Array(p.faces.length));
  const unmatched = [];
  N.forEach(n => {
    let hit = -1;
    for (let dx = -1; dx <= 1 && hit < 0; dx++) for (let dy = -1; dy <= 1 && hit < 0; dy++) for (let dz = -1; dz <= 1 && hit < 0; dz++)
      for (const k of grid.get(key(n.f.c, dx, dy, dz)) || []) if (!used[k] && near(O[k].f, n.f)) { hit = k; break; }
    if (hit >= 0) used[hit] = 1; else unmatched.push(n);
  });
  // A flat face still on the same plane as a vanished flat face was reshaped, not added.
  const samePlane = (a, b) => a.flat && b.flat && a.n[0] * b.n[0] + a.n[1] * b.n[1] + a.n[2] * b.n[2] > 0.9999 && Math.abs(a.d - b.d) <= tol;
  let added = 0, modified = 0;
  unmatched.forEach(n => {
    let best = -1, bestDist = Infinity;
    O.forEach((o, k) => {
      if (used[k] || !samePlane(o.f, n.f)) return;
      const dist = Math.hypot(o.f.c[0] - n.f.c[0], o.f.c[1] - n.f.c[1], o.f.c[2] - n.f.c[2]);
      if (dist < bestDist) { bestDist = dist; best = k; }
    });
    if (best >= 0) { used[best] = 1; status[n.pi][n.fi] = MODIFIED; modified++; }
    else { status[n.pi][n.fi] = ADDED; added++; }
  });
  const removed = oldParts.map(p => new Uint8Array(p.faces.length));
  let gone = 0;
  O.forEach((o, k) => { if (!used[k]) { removed[o.pi][o.fi] = 1; gone++; } });
  return {status, removed, added, modified, gone};
}

function renderFaceDiff(view, parts, prevParts, d, keepCam) {
  view.group.clear();
  const mats = [mkMat(COLORS.dim), mkMat(COLORS.added), mkMat(COLORS.modified)];
  parts.forEach((pt, pi) => {
    view.group.add(new THREE.Mesh(faceGroups(pt, fi => d.status[pi][fi]), mats));
    addEdges(view, pt);
  });
  const ghost = [mkMat(COLORS.removed, true)];
  prevParts.forEach((pt, pi) => {
    if (d.removed[pi].some(Boolean)) view.group.add(new THREE.Mesh(faceGroups(pt, fi => d.removed[pi][fi] ? 0 : -1), ghost));
  });
  if (!keepCam) frame(view);
}

function frame(view) {
  const box = new THREE.Box3().setFromObject(view.group);
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3()), d = box.getSize(new THREE.Vector3()).length();
  view.cam.near = d / 100; view.cam.far = d * 100; view.cam.updateProjectionMatrix();
  view.cam.position.copy(c).addScaledVector(new THREE.Vector3(...VIEW_DIR).normalize(), d * 1.9);
  view.ctl.target.copy(c);
  view.ctl.update();
}

function render(view, parts, {changes = {}, ghosts = [], highlight = false, keepCam = false} = {}) {
  view.group.clear();
  parts.forEach(pt => addPart(view, pt, highlight ? COLORS[changes[pt.name]] ?? COLORS.dim : null));
  ghosts.forEach(pt => addPart(view, pt, COLORS.removed, true));
  if (!keepCam) frame(view);
}

// A model is identified by its STEP file name, ignoring case and the .step/.stp ending.
const stem = s => String(s || "").replace(/\.[^.\\/]+$/, "").trim();
const keyOf = s => stem(s).toLowerCase();
const isAssembly = name => /assembly$/i.test(stem(name));

function groups(p) {
  const m = new Map();
  p.versions.forEach(v => {
    const k = keyOf(v.source);
    if (!m.has(k)) m.set(k, {name: v.source || p.title, named: false, versions: []});
    const g = m.get(k);
    g.versions.push(v);
    if (v.source) { g.name = v.source; g.named = true; }  // most recent spelling of the file name
  });
  const gs = [...m.values()];
  gs.forEach(g => { g.assembly = g.named && isAssembly(g.name); });
  // Assembly files come first; otherwise keep the order they were added.
  return gs.sort((a, b) => b.assembly - a.assembly);
}

// When a project last changed: the newer of its folder's modified date and its latest version.
const updated = p => [p.modified || "", ...p.versions.map(v => v.date || "")].sort().pop();
const visible = () => DATA.projects.filter(p => !p.hidden);

function home() {
  const s = DATA.site || {};
  // newest first, so the most recently changed project sits top left
  const list = visible().sort((a, b) => updated(b).localeCompare(updated(a)));
  app.innerHTML = `<section class="hero"><h1>Miko’s Projects</h1><p>${esc(s.intro || "Open a project to explore each design in 3D.")}</p></section>
  <div class="grid">${list.map(p => {
    const n = p.versions.length;
    const when = updated(p).slice(0, 10);
    const thumb = p.image
      ? `<img class="fill" src="${esc(p.image)}" alt="" aria-hidden="true" loading="lazy"><img class="pic" src="${esc(p.image)}" alt="${esc(p.title)} preview" loading="lazy">`
      : PLACEHOLDER;
    return `<a class="card" href="#/${esc(p.id)}"><div class="thumb">${thumb}</div><div class="cbody"><h2>${esc(p.title)}</h2>${p.summary ? `<p>${esc(p.summary)}</p>` : ""}
    ${(p.tags || []).length ? `<div class="tags">${p.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>` : ""}
    ${n ? `<div class="ruler" aria-hidden="true">${p.versions.map((_, i) => `<i style="--c:${tickColor(i, n)}"></i>`).join("")}</div>` : ""}
    ${when ? `<div class="meta"${n ? "" : ' style="margin-top:auto"'}>Last updated: ${esc(when)}</div>` : ""}</div></a>`;
  }).join("")}</div>`;
}

// ---- Assembly windows: latest model with its note as a description ----
function assemblyHtml(g) {
  const latest = g.versions[g.versions.length - 1];
  return `<section class="win asm" aria-label="${esc(g.name)}">
    <div class="viewer"><p class="overlay"></p><b class="fname">${esc(g.name)}</b></div>
    ${latest.note ? `<p class="desc">${esc(latest.note)}</p>` : ""}</section>`;
}

async function makeAssembly(sec, g) {
  const msg = sec.querySelector(".overlay");
  const view = createViewer(sec.querySelector(".viewer"));
  wins.push(view);
  msg.textContent = "Loading model…";
  try {
    render(view, await loadParts(g.versions[g.versions.length - 1]));
    msg.textContent = "";
  } catch (e) { msg.textContent = e.message; }
}

// ---- Part windows: version list, change highlighting and status line ----
function partHtml(g) {
  return `<section class="win" aria-label="${esc(g.name)}"><div class="work"><div>
    <div class="viewer"><b class="fname">${esc(g.name)}</b></div>
    <div class="bar"><label><input type="checkbox" class="chg" checked>Highlight changes from the previous version</label>
    <span class="legend"></span></div>
    <p class="status"></p></div>
    <ol class="tl" aria-label="Versions of ${esc(g.name)}"></ol></div></section>`;
}

async function show(w, keepCam) {
  const v = w.vs[w.i], t = ++w.token;
  const first = w.i === 0;
  w.el.chk.disabled = first;
  const hl = w.changes && !first;
  w.el.status.textContent = "Loading model…";
  try {
    const parts = await loadParts(v);
    const prev = hl ? await loadParts(w.vs[w.i - 1]) : null;
    if (t !== w.token) return;
    const chips = (a, m, r, unit) => {
      const u = n => n === 1 ? unit : unit + "s";
      return `<span style="--c:var(--add)">${a} ${u(a)} added</span><span style="--c:var(--mod)">${m} ${u(m)} modified</span><span style="--c:var(--rem)">${r} ${u(r)} removed</span>`;
    };
    if (hl && parts.every(p => p.faces) && prev.every(p => p.faces)) {
      // per feature: compare face by face (done once per version, then kept)
      const d = v._diff || (v._diff = faceDiff(prev, parts));
      renderFaceDiff(w.view, parts, prev, d, keepCam);
      w.el.legend.innerHTML = d.added + d.modified + d.gone
        ? chips(d.added, d.modified, d.gone, "face") : "No geometry changes";
    } else {
      // fallback (models without face data): whole parts, from the updater's part list
      const ghosts = hl && v.removed?.length ? prev.filter(x => v.removed.includes(x.name)) : [];
      render(w.view, parts, {changes: v.changes || {}, ghosts, highlight: hl, keepCam});
      const n = k => Object.values(v.changes || {}).filter(x => x === k).length;
      w.el.legend.innerHTML = hl ? chips(n("added"), n("modified"), (v.removed || []).length, "part") : "";
    }
    w.el.status.textContent = parts.length + (parts.length === 1 ? " part" : " parts") + ". Drag to rotate, scroll to zoom, right-drag to pan.";
  } catch (e) { if (t === w.token) w.el.status.textContent = e.message; }
}

function timeline(w) {
  w.el.tl.innerHTML = w.vs.map((v, i) =>
    `<li class="${i === w.i ? "on" : ""}"><button data-i="${i}"${i === w.i ? ' aria-current="true"' : ""}><b>${esc(v.id || "v" + (i + 1))}</b><time>${esc(v.date)}</time><span>${esc(v.note)}</span></button></li>`).join("");
}

function makePart(sec, g) {
  const q = s => sec.querySelector(s);
  const w = {vs: g.versions, i: g.versions.length - 1, changes: true, token: 0,
    el: {chk: q(".chg"), legend: q(".legend"), status: q(".status"), tl: q(".tl")}};
  w.view = createViewer(q(".viewer"));
  wins.push(w.view);
  timeline(w); show(w);
  w.el.tl.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    w.i = +b.dataset.i; timeline(w); show(w);
  };
  w.el.chk.onchange = e => { w.changes = e.target.checked; show(w, true); };
}

function project(p) {
  const gs = groups(p);
  app.innerHTML = `<a class="back" href="#/">All projects</a>
  <div class="phead"><h1>${esc(p.title)}</h1>${p.summary ? `<p>${esc(p.summary)}</p>` : ""}</div>
  ${gs.length ? `<div class="wins">${gs.map(g => g.assembly ? assemblyHtml(g) : partHtml(g)).join("")}</div>`
    : '<p class="meta">3D models for this project are on the way.</p>'}
  ${progressHtml(p)}`;
  app.querySelectorAll(".win").forEach((sec, k) => gs[k].assembly ? makeAssembly(sec, gs[k]) : makePart(sec, gs[k]));
  app.querySelectorAll(".pitem button").forEach(b => b.onclick = () => enlarge(b.dataset.src, b.dataset.cap, b.dataset.date));
}

// ---- Progress photos (added from the phone app; stored in data/progress.json) ----
function photosOf(p) {
  const all = PROGRESS.projects || {};
  const list = [p.id, ...(p.aliases || [])].flatMap(k => all[k] || []);
  return list.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));  // newest first
}

function niceDate(iso) {
  const d = new Date(iso);
  return isNaN(d) ? esc(iso) : d.toLocaleDateString(undefined, {year: "numeric", month: "short", day: "numeric"});
}

function progressHtml(p) {
  const photos = photosOf(p);
  if (!photos.length) return "";
  return `<section class="progress" aria-labelledby="progress-h"><h2 id="progress-h">Progress</h2>
    <p class="sub">${photos.length} photo${photos.length === 1 ? "" : "s"} from the build, newest first.</p>
    <div class="pgrid">${photos.map(ph => `<figure class="pitem" style="margin:0">
      <button data-src="${esc(ph.image)}" data-cap="${esc(ph.caption || "")}" data-date="${esc(niceDate(ph.date))}"
        aria-label="Enlarge photo${ph.caption ? ": " + esc(ph.caption) : ""}"><img src="${esc(ph.image)}" alt="${esc(ph.caption || "Progress photo")}" loading="lazy"></button>
      <figcaption class="pmeta"><time datetime="${esc(ph.date)}">${niceDate(ph.date)}</time>${ph.caption ? `<p>${esc(ph.caption)}</p>` : ""}</figcaption>
    </figure>`).join("")}</div></section>`;
}

function enlarge(src, cap, date) {
  const box = document.createElement("div");
  box.className = "lightbox";
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-label", "Progress photo");
  box.tabIndex = -1;
  box.innerHTML = `<img src="${esc(src)}" alt="${esc(cap || "Progress photo")}">${cap ? `<p>${esc(cap)}</p>` : ""}<time>${esc(date)}</time>`;
  const close = () => { box.remove(); removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  box.onclick = close;
  addEventListener("keydown", onKey);
  document.body.appendChild(box);
  box.focus();
}

function route() {
  wins.forEach(view => view.dispose());
  wins = [];
  const id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  // an old address from before a rename opens the project and switches to its new address
  const p = visible().find(x => x.id === id) || visible().find(x => (x.aliases || []).includes(id));
  if (p && p.id !== id) history.replaceState(null, "", "#/" + encodeURIComponent(p.id));
  p ? project(p) : home();
  window.scrollTo(0, 0);
}

// "no-cache": always check GitHub for a newer project list, so renames and new versions
// show up on the next page load instead of up to 10 minutes later.
Promise.all([
  fetch("data/projects.json", {cache: "no-cache"}).then(r => r.json()),
  fetch("data/progress.json", {cache: "no-cache"}).then(r => r.ok ? r.json() : {projects: {}}).catch(() => ({projects: {}})),
]).then(([d, prog]) => {
  DATA = d;
  PROGRESS = prog && prog.projects ? prog : {projects: {}};
  addEventListener("hashchange", route);
  route();
}).catch(() => {
  app.innerHTML = "<p>Could not load data/projects.json. Serve this folder over http (for example, run <code>python -m http.server</code> here) instead of opening the file directly.</p>";
});
</script>
</body>
</html>
